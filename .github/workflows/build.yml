name: Build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
          - os: windows-latest
            platform: windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar libs del sistema (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Calcular versión
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            FULL_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE_VERSION=$(cat VERSION)
            SHA=$(git rev-parse --short HEAD)
            FULL_VERSION="${BASE_VERSION}_${SHA}"
          fi
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"

      - name: Compilar
        run: pyinstaller --onefile --windowed --name posturografox app/main.py

      - name: Empaquetar binario
        shell: bash
        run: |
          mkdir -p out
          cp "dist/posturografox${{ matrix.ext }}" "out/posturografox-${{ matrix.platform }}-${FULL_VERSION}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: posturografox-${{ matrix.platform }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Calcular versión y tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            FULL_VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/}"
            PRERELEASE=false
          else
            BASE_VERSION=$(cat VERSION)
            SHA=$(git rev-parse --short HEAD)
            FULL_VERSION="${BASE_VERSION}_${SHA}"
            TAG_NAME="build-${FULL_VERSION}"
            PRERELEASE=true
          fi
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.FULL_VERSION }}
          prerelease: ${{ env.PRERELEASE }}
          files: dist-artifacts/**/*
