name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
          - os: windows-latest
            platform: windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar libs del sistema (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev \
            libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compilar
        working-directory: rust
        run: cargo build --release

      - name: Empaquetar binario
        shell: bash
        working-directory: rust
        run: |
          mkdir -p out
          cp "target/release/posturografox${{ matrix.ext }}" \
             "out/posturografox-${{ matrix.platform }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: posturografox-${{ matrix.platform }}
          path: rust/out/*

  publicar:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artefactos/**/*
          generate_release_notes: true
