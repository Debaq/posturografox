name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
          - os: windows-latest
            platform: windows
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar libs del sistema (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev \
            libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compilar
        working-directory: rust
        run: cargo build --release

      # El binario suelto se publica igual que antes, además del paquete: sirve
      # para probar una versión sin instalar nada, y es la red si el instalador
      # o el AppImage fallan en un equipo particular.
      - name: Guardar el binario suelto
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/release/posturografox${{ matrix.ext }}" \
             "out/posturografox-${{ matrix.platform }}${{ matrix.ext }}"

      # AppImage y no un binario pelado: compilado en Ubuntu, el binario falla
      # en una distro más vieja con "GLIBC_2.xx not found", que es justo el PC
      # que hay en un box y que nadie actualiza.
      - name: Empaquetar AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          # linuxdeploy se baja acá y el script lo recibe por LINUXDEPLOY: así
          # el mismo script sirve en CI y en la consola de quien ya lo tiene.
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          # Sin FUSE en el runner, un AppImage no se puede montar: se ejecuta
          # extrayéndolo. Vale para linuxdeploy y para el appimagetool que usa.
          export APPIMAGE_EXTRACT_AND_RUN=1
          LINUXDEPLOY="$PWD/linuxdeploy" packaging/linux/build-appimage.sh

      # Instalador y no el .exe suelto: el .exe no deja acceso directo, no se
      # desinstala y no se puede volver atrás sin adivinar qué archivo era.
      # En PowerShell y no en bash: Git Bash traduce cualquier argumento que
      # empiece con "/" a una ruta de Windows, así que /DMiVersion=... llegaba
      # como C:/Program Files/Git/DMiVersion=... e ISCC respondía "You may not
      # specify more than one script filename".
      - name: Empaquetar instalador (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # La imagen del runner ya trae Inno Setup; choco queda solo por si un
          # día deja de traerlo.
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          Copy-Item rust\target\release\posturografox.exe out\posturografox.exe
          $version = (Select-String -Path rust\Cargo.toml -Pattern '^version = "(.+)"' |
                      Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DMiVersion=$version" packaging\windows\posturografox.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con $LASTEXITCODE" }
          Remove-Item out\posturografox.exe

      - uses: actions/upload-artifact@v4
        with:
          name: posturografox-${{ matrix.platform }}
          path: out/*

  publicar:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artefactos/**/*
          generate_release_notes: true
