[package]
name = "posturografox"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
egui_plot = "0.36.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serialport = "4.10.1"
rodio = "0.20.1"
serde = { version = "1", features = ["derive"] }
ron = "0.12.2"

[dev-dependencies]
tempfile = "3.27.0"
